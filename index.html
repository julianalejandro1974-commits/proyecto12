
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de caracteres</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/limit.js" defer></script>
</head>
<body>

    <div class="contenedor">
        <h1>Escribe tu mensaje</h1>

        <div class="zona-texto">
            <textarea
                id="mensaje"
                placeholder="Empieza a escribir..."
                maxlength="250"
            ></textarea>

            <div class="informacion">
                <span id="contador">0 / 10</span>
            </div>
        </div>
    </div>

</body>
</html>
